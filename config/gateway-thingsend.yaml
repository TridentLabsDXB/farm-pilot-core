# ThingSend XZ-DS-MUS2 register map. Source of truth: manual "XZ-DS-MUS2 manual V20".
# CONFIRMED = seen on the bench capture of 2026-11-16 (ThingSend XZ-Modbus-Tool V2.0, 9600 8N1, real gateway + T/H sensors).
# Every value marked ASSUMED is NOT in the manual or the capture and must be verified on the real gateway (see README, "Hardware validation checklist").
# To swap in a real value: edit this file, bump map_version, restart farmpilot-core. The loader refuses to start polling if the file is invalid.
gateway_model: XZ-DS-MUS2
manual_version: V20
map_version: 2                # 2 = bench findings of 2026-11-16 (decimal serials, interval in minutes, 0xFFFF empty slots)
byte_order: big_endian        # each register is 16 bits, high byte first (per manual)
default_gateway_address: 7    # the test unit answers as 7 (ASSUMED as a general default). Never 123 or 160; 0x00 and 0xFF are broadcast. CORE never writes to broadcast.
empty_group_marker: 0xFFFF    # CONFIRMED: an unconfigured config slot reads back 0xFFFF. What a slot reads after writing zeros is still to be checked, so all-zero is also treated as empty.
serial_pattern: "^[0-9]{7,10}$"   # CONFIRMED: the printed serial is the plain DECIMAL of the 32-bit value (0x06B624FD = 112600317); 7 to 10 digits seen so far, also checked to fit 32 bits.

system:                       # FC04 read, FC06 write
  address:       { reg: 0x0000, read_fc: 4, write_fc: 6 }   # FC06 write = set gateway address
  group_address: { reg: 0x0001, read_fc: 4 }                 # CONFIRMED: PID 300 on the test unit
  version:       { reg: 0x0002, read_fc: 4 }
  delete_all:    { reg: 0x0003, write_fc: 6, value: 0 }     # FC06 0x0003 = 0 deletes all configured sensors

health:                       # defaults, all ASSUMED until the battery type is confirmed; Admin can override in Settings
  offline_multiplier: 3       # missed intervals before "no update"
  rssi_good_above: -90
  rssi_poor_below: -105

types:
  th:                         # XZ-DS01-TH2D / XZ-DS01-TP2C
    enabled: true
    label: "T/H"
    models: [XZ-DS01-TH2D, XZ-DS01-TP2C]
    groups: 30
    low_voltage: 3.20         # ASSUMED
    default_interval: 5       # minutes (the gateway's unit for T/H): 5 min is the default AND the minimum; 30 s and 1 min are not possible
    presets: [5, 10, 15, 30]  # offered in the UI; any whole number of minutes inside interval.min..max is also accepted (custom value)
    # no commissioning_presets: short intervals do not exist on this gateway (the commissioning-mode option only appears for a type that lists some)
    config:
      base: 0x0100            # end 0x0177
      regs_per_group: 4       # [serial_hi, serial_lo, interval (ST), control (CMD)]  (order CONFIRMED)
      write_fc: [6, 16]
      read_fc: 4
      serial:   { reg: 0, type: u32, regs: 2, word_order: high_first }   # CONFIRMED; printed serial = decimal of the u32
      interval: { reg: 2, unit: minutes, min: 5, max: 240 }             # bench value 5 on all sensors; "minutes" and 5..240 from the MDMS manual's T/H sampling row: still to confirm by watching the real update rate
      control:  { reg: 3, value_on_add: 0 }                              # 0 on all bench sensors ("none"); other values ASSUMED unknown
    data:
      base: 0x0001
      regs_per_channel: 4
      read_fc: 3
      never_received: all_zero    # CONFIRMED: a configured sensor that never transmitted (no battery) reads all zeros = "no data"
      fields:
        temperature: { reg: 0, type: i16, scale: 0.1,  unit: C,   calibrated: true }
        humidity:    { reg: 1, type: u16, scale: 0.1,  unit: "%RH", calibrated: true }
        voltage:     { reg: 2, type: u16, scale: 0.01, unit: V }
        rssi:        { reg: 3, type: i16, scale: 1,    unit: dBm }

  # ---- Disabled placeholders (Milestone 2b). Layouts from the manual. ----
  gas:                        # CO2 and other gases
    enabled: false
    label: "Gas"
    models: []
    groups: 15
    default_interval: 5
    presets: [5, 15, 30]
    config: { base: 0x0200, regs_per_group: 4, write_fc: [6, 16], read_fc: 4,
      serial: { reg: 0, type: u32, regs: 2, word_order: high_first }, interval: { reg: 2, unit: minutes, min: 5, max: 240 }, control: { reg: 3, value_on_add: 0 } }
    data:
      base: 0x1001
      regs_per_channel: 8
      read_fc: 3
      fields:
        gas_ppm:     { reg: 0, type: u16, scale: 1,    unit: ppm }
        gas_percent: { reg: 1, type: u16, scale: 0.01, unit: "%" }
        gas_index:   { reg: 2, type: u16, scale: 1,    unit: "" }
        pressure:    { reg: 3, type: u16, scale: 1,    unit: mbar }   # 0 = unsupported
        temperature: { reg: 4, type: i16, scale: 0.1,  unit: C }
        humidity:    { reg: 5, type: u16, scale: 0.1,  unit: "%RH" }
        voltage:     { reg: 6, type: u16, scale: 0.01, unit: V }
        rssi:        { reg: 7, type: i16, scale: 1,    unit: dBm }
  light:                      # XZ-DS01-LUA, lux/UV
    enabled: false
    label: "Light"
    models: [XZ-DS01-LUA]
    groups: 30
    default_interval: 5
    presets: [5, 15, 30]
    config: { base: 0x0300, regs_per_group: 4, write_fc: [6, 16], read_fc: 4,
      serial: { reg: 0, type: u32, regs: 2, word_order: high_first }, interval: { reg: 2, unit: minutes, min: 5, max: 240 }, control: { reg: 3, value_on_add: 0 } }
    data:
      base: 0x2001
      regs_per_channel: 4
      read_fc: 3
      fields:     # lux is u32 over 2 regs; UV variant is /1000
        lux:     { reg: 0, type: u32, scale: 1,    unit: lux, word_order: high_first }
        voltage: { reg: 2, type: u16, scale: 0.01, unit: V }
        rssi:    { reg: 3, type: i16, scale: 1,    unit: dBm }
  door_smoke:                 # XZ-DS01-DMA
    enabled: false
    label: "Door/Smoke"
    models: [XZ-DS01-DMA]
    groups: 30
    default_interval: 5
    presets: [5, 15, 30]
    config: { base: 0x0500, regs_per_group: 4, write_fc: [6, 16], read_fc: 4,
      serial: { reg: 0, type: u32, regs: 2, word_order: high_first }, interval: { reg: 2, unit: minutes, min: 5, max: 240 }, control: { reg: 3, value_on_add: 0 } }
    data:
      base: 0x4001
      regs_per_channel: 4
      read_fc: 3
      fields:
        status:  { reg: 0, type: u16, scale: 1,    unit: "" }
        reserved: { reg: 1, type: i16, scale: 1,    unit: "" }   # manual unclear: temperature or reserved
        voltage: { reg: 2, type: u16, scale: 0.01, unit: V }
        rssi:    { reg: 3, type: i16, scale: 1,    unit: dBm }
  soil:                       # XZ-DSF3-SMA/B-X
    enabled: false
    label: "Soil"
    models: [XZ-DSF3-SMA-X, XZ-DSF3-SMB-X]
    groups: 10
    default_interval: 30      # minutes (soil range not checked: ASSUMED 5..1440)
    presets: [30, 60, 180]
    config: { base: 0x0600, regs_per_group: 4, write_fc: [6, 16], read_fc: 4,
      serial: { reg: 0, type: u32, regs: 2, word_order: high_first }, interval: { reg: 2, unit: minutes, min: 5, max: 1440 }, control: { reg: 3, value_on_add: 0 } }
    data:
      base: 0x5001            # manual text says 0x4001 but its sample frame uses 0x5001: VERIFY (0x4001 would overlap door_smoke)
      regs_per_channel: 10
      read_fc: 3
      fields:
        temperature: { reg: 0, type: i16, scale: 0.1,  unit: C }
        humidity:    { reg: 1, type: u16, scale: 0.1,  unit: "%" }
        ph:          { reg: 2, type: u16, scale: 0.1,  unit: pH }
        ec:          { reg: 3, type: u16, scale: 1,    unit: uS/cm }
        salinity:    { reg: 4, type: u16, scale: 1,    unit: mg/L }
        n:           { reg: 5, type: u16, scale: 1,    unit: mg/L }
        p:           { reg: 6, type: u16, scale: 1,    unit: mg/L }
        k:           { reg: 7, type: u16, scale: 1,    unit: mg/L }
        voltage:     { reg: 8, type: u16, scale: 0.01, unit: V }
        rssi:        { reg: 9, type: i16, scale: 1,    unit: dBm }
# Water quality sensors are mentioned in the manual without a protocol: not included.
